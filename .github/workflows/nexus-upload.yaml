# Uploads a finished release zip to Nexus Mods as a new version of the existing file.
#
# The game's DLLs are not on GitHub, so CI cannot build the mod. The Mod Build Watcher builds it on your machine and
# publishes a GitHub release whose tag is the version (v1.1.0) with ModSettingsHub-<version>.zip attached and the
# changelog as release notes. Publishing the release runs this workflow. It can also be run by hand from the Actions tab.
#
# One-time setup in the repo's Settings > Secrets and variables > Actions (the publish script can set the variables):
#   Secret    NEXUSMODS_API_KEY   your personal Nexus API key
#   Variable  NEXUSMODS_MOD_ID    the mod page's ID
#   Variable  NEXUSMODS_FILE_ID   the Main file's File ID (Files tab > Advanced, or the edit menu on Manage files)
name: Upload to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload (for example v1.1.0)'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Get the release zip and notes
        id: rel
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "ModSettingsHub-*.zip" --dir .
          ZIP="$(ls ModSettingsHub-*.zip | head -n 1)"
          case "$ZIP" in
            "ModSettingsHub-$VERSION.zip") ;;
            *) echo "Attached zip '$ZIP' does not match tag '$TAG'"; exit 1 ;;
          esac
          NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            echo "version=$VERSION"
            echo "zip=$ZIP"
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: ${{ steps.rel.outputs.zip }}
          display_name: Mod Settings Hub ${{ steps.rel.outputs.version }}
          version: ${{ steps.rel.outputs.version }}
          category: main
          changelog: ${{ steps.rel.outputs.notes }}
          update_mod_version: true
